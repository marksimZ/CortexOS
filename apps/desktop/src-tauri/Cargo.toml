[package]
name = "cortexos-desktop"
version = "0.2.0"
description = "Local-first AI cognitive studio"
authors = ["CortexOS contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cortexos_desktop_lib"
# The Windows desktop binary links the Rust library directly.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
jsonschema = { version = "=0.60.0", default-features = false }
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "process", "io-util"] }
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"
zeroize = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls"] }
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
